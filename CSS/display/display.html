<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .badge{
            display: flex;
            background-color: #bae6fd;
            color: #0369a1;
            padding: 10px;
            /*  Tentativa de definir um tamanho rigido */
            width: 150px;
            height: 60px;
            /* Tentativa de espaçamnto vertical */
            margin-bottom: 30px;
            justify-content: center;
            align-items: center;

        }

        .btn-acao{
            display: block;
            width: 100px;
            background-color: #0284c7;
            color: white;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            align-items: center;
        }
        .alerta-sistema{
            background-color: #fef08a;
            color: #854d0e;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #facc15;

            /* A linha abixo ativa o modo fantasma do aviso */
            display: none;
        }


    </style>
</head>
<body>
    <div class="card-perfil">
        <h2>Perfil do jogador</h2>
        <p>Conquistas recentes no sistema</p>

        <!-- Conquistas (Badges) -->
        <span class="badge"> Nivel 99</span>
        <span class="badge"> Mestre CSS</span>
        <span class="badge"> VIP</span>

        <!-- Ações do Perfil -->
         <a href="#" class="btn-acao">Editar Perfil</a>
         <a href="#" class="btn-acao">Ver Inventario</a>
       

         <!-- alerta -->
          <div class="alerta-sistema">Manutenção programada</div>
            
    </div>
</body>
</html>
