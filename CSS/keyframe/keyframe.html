<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframe</title>
    <style>
        *{
            box-sizing: border-box;
            padding: ;
        }
        /* efeito de fluuação continua */
        @keyframes
        flutuar{
            /* na metade do tempo, sobe 8 pixels */
            0%{
                transform: translateY(0px);
            }
            50%{
                transform: translateY(-8px);
            }
            /* volta suavemente para o ponto inicial */
            100%{
                transform: translateY(0px);
            }

        .icone-bau{
            width: 25px;
            height: auto;
            animation: flutuar 2.5s ease-in-out infinite;

        }
        /* responsividade para telas menores que 768px (Celulares/Tablets) */
        @media (max-width: 768px) {
            /* transforma as 3 colunas em apenas uma coluna */
            .vitrine-jogos{
                grid-template-columns: 1fr;
            }
        }
        .navbar-gamer{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: antiquewhite;
            flex-direction: column;
            height: auto;
            padding: 16px;
            border-bottom: 2px splid
        }
    }
    </style>
</head>
<body>
    <header class="navbar-gamer">
        <h1>Gamer Store</h1>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Jogos</a>
            <a href="#">Contato</a>
        </nav>
    </header>
    <main class="vitrine-jogos">
           
         <div class="card-jogo">
            <img src="https://cdn-icons-png.flaticon.com/512/4883/4883370.png" alt="Baú de Oferta" class="icone-bau">
                <h3>Jogo 1</h3>
            </div>

             <div class="card-jogo">
                <h3>Jogo 2</h3>
            </div>

             <div class="card-jogo">
                <h3>Jogo 3</h3>
            </div>
    </main>
</body>
</html>
